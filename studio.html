<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixelator Studio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0a0a0a;
            color: #fff;
            overflow: hidden;
        }

        .app {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .header {
            padding: 16px 24px;
            background: #111;
            border-bottom: 1px solid #222;
        }

        .header h1 {
            font-size: 20px;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .main {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        .canvas-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0a0a0a;
            position: relative;
            overflow: auto;
        }

        #canvas {
            max-width: 100%;
            max-height: 100%;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        .controls {
            width: 340px;
            background: #111;
            border-left: 1px solid #222;
            overflow-y: auto;
        }

        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.9);
            padding: 24px;
            border-radius: 8px;
            display: none;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #333;
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Stops Editor Modal */
        .stops-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .stops-modal.active {
            display: flex;
        }

        .stops-editor {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 24px;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .stops-editor h2 {
            margin-bottom: 16px;
            font-size: 18px;
        }

        .stops-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 16px;
        }

        .stop-item {
            background: #222;
            border: 1px solid #333;
            border-radius: 4px;
            padding: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .stop-percentage {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .stop-percentage input {
            width: 60px;
            padding: 4px 8px;
            background: #333;
            border: 1px solid #444;
            border-radius: 4px;
            color: #fff;
            font-size: 14px;
        }

        .stop-char-input {
            width: 50px;
            padding: 8px;
            background: #333;
            border: 1px solid #444;
            border-radius: 4px;
            color: #fff;
            font-size: 18px;
            text-align: center;
            font-family: monospace;
        }

        .color-pair {
            display: flex;
            gap: 4px;
        }

        .color-picker {
            width: 40px;
            height: 40px;
            border: 1px solid #444;
            border-radius: 4px;
            cursor: pointer;
        }

        .stop-remove-btn {
            margin-left: auto;
            padding: 8px 12px;
            background: #c00;
            border: none;
            border-radius: 4px;
            color: #fff;
            cursor: pointer;
            font-size: 16px;
        }

        .stop-remove-btn:hover {
            background: #e00;
        }

        .stops-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .stops-actions button {
            padding: 8px 16px;
            background: #333;
            border: 1px solid #444;
            border-radius: 4px;
            color: #fff;
            cursor: pointer;
            font-size: 14px;
        }

        .stops-actions button:hover {
            background: #444;
        }

        .stops-actions button.primary {
            background: #0066cc;
            border-color: #0066cc;
        }

        .stops-actions button.primary:hover {
            background: #0077ee;
        }
    </style>
</head>
<body>
    <div class="app">
        <header class="header">
            <h1>PIXELATOR STUDIO</h1>
        </header>

        <main class="main">
            <div class="canvas-container">
                <canvas id="canvas"></canvas>
                <div class="loading" id="loading">
                    <div class="spinner"></div>
                </div>
            </div>

            <div class="controls" id="controls"></div>
        </main>
    </div>

    <!-- Hidden inputs -->
    <input type="file" id="imageInput" accept="image/*" style="display:none">
    <input type="file" id="svgInput" accept=".svg" style="display:none">
    <input type="file" id="fontInput" accept=".ttf,.otf,.woff,.woff2" style="display:none">

    <!-- Stops Editor Modal -->
    <div class="stops-modal" id="stopsModal">
        <div class="stops-editor">
            <h2 id="stopsEditorTitle">Edit Character Stops</h2>
            <div class="stops-list" id="stopsList"></div>
            <div class="stops-actions">
                <button id="addStopBtn">+ Add Stop</button>
                <button id="closeStopsBtn" class="primary">Close</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/tweakpane@3.1.9/dist/tweakpane.min.js"></script>
    <script src="studio/core.js"></script>
    <script src="studio/shapes.js"></script>
    <script src="studio/algorithms.js"></script>
    <script src="studio/mode-shape.js"></script>
    <script src="studio/mode-ascii.js"></script>
    <script src="studio/mode-typewriter.js"></script>
    <script src="studio/mode-emoji.js"></script>
    <script src="studio/quadtree-builder.js"></script>
    <script src="studio/mode-quadtree.js"></script>
    <script src="studio/stops-editor.js"></script>
    <script src="studio/app.js"></script>
</body>
</html>
